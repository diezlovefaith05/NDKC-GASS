<script>
    let submitted = false;

    // Set today's date automatically
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    
    const dateStr = `${yyyy}-${mm}-${dd}`;
    document.getElementById('date').value = dateStr;

    // Generate Ticket Number format: NDKC-GASS-MMDDYYYY001 (ascending)
    function generateTicketNumber() {
        const dateTag = `${mm}${dd}${yyyy}`;
        const storageKey = `ndkc_ticket_counter_${dateTag}`;
        
        let counter = localStorage.getItem(storageKey);
        if (!counter) {
            counter = 1;
        } else {
            counter = parseInt(counter, 10) + 1;
        }
        localStorage.setItem(storageKey, counter);
        
        const paddedCounter = String(counter).padStart(3, '0');
        return `NDKC-GASS-${dateTag}${paddedCounter}`;
    }

    const currentTicket = generateTicketNumber();
    document.getElementById('ticketNumberDisplay').value = currentTicket;

    // Intercept submit to prepend ticket number into the task field
    document.getElementById('repairForm').addEventListener('submit', function() {
        const rawTask = document.getElementById('taskInput').value;
        document.getElementById('entry_task').value = `[Ticket: ${currentTicket}] ${rawTask}`;
    });

    function showSuccess() {
        document.getElementById('repairForm').style.display = 'none';
        document.getElementById('successMessage').style.display = 'block';
    }
</script>

</body>
</html>
